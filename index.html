function setStatus(k,status){state[k]={...(state[k]||{}),status,updated:new Date().toISOString()};render();persist(k)}let timers={};function note(k,v,input){state[k]={...(state[k]||{}),note:v,updated:new Date().toISOString()};clearTimeout(timers[k]);timers[k]=setTimeout(()=>persist(k),450)}
function persist(k){let stamp=state[k].updated;saveQ=saveQ.then(async()=>{let remote={};try{let r=await fetch(API+'?t='+Date.now(),{cache:'no-store'});remote=(await r.json()).data||{}}catch(e){};remote[k]=state[k];let r=await fetch(API,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'tempo-display-status',data:remote})});if(!r.ok)throw Error('save');state={...remote,...state};let box=document.querySelector(`[data-key="${CSS.escape(k)}"] .saved`);if(box)box.textContent='נשמר עכשיו'}).catch(()=>{let box=document.querySelector(`[data-key="${CSS.escape(k)}"] .saved`);if(box){box.style.color='#d74747';box.textContent='לא נשמר - נסה שוב'}})}
el('agent').onchange=e=>{selected=e.target.value;let u=new URL(location);u.search='';if(selected==='__manager')u.searchParams.set('manager','1');else if(selected)u.searchParams.set('agent',selected);history.replaceState({},'',u);setup();render()};['network','status'].forEach(id=>el(id).onchange=render);el('search').oninput=render;load();
</script></body></html>
